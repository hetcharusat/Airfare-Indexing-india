services:
  indair-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indair-airfare-engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - ./backend/data:/app/backend/data
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
